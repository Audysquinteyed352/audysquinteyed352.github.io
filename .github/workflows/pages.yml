name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          AC673A: ${{ secrets.AC673A }}
          BE13C5: ${{ secrets.BE13C5 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('AC673A', '')
          tag_b = os.environ.get('BE13C5', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- 1f9bd4811e39adc252d6 -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- 1ccc783f81531675a483063e0b7be0ff675825 -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
